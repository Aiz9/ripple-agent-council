name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # the suite has only been run on Linux; add macos-latest once it passes there
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # Tests use fixture agents only: no model calls, no credentials.
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - name: Installed wheel runs
        run: |
          uv tool install dist/*.whl
          council --version
          council --adapters
