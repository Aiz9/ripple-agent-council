[project]
name = "agent-council"
version = "0.5.0"
description = "Multi-agent CLI orchestrator: one prompt, several coding-agent CLIs debate to consensus."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Madan Sen" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Aiz9/Agent-council"
Documentation = "https://github.com/Aiz9/Agent-council/tree/main/docs"
Issues = "https://github.com/Aiz9/Agent-council/issues"
Changelog = "https://github.com/Aiz9/Agent-council/blob/main/CHANGELOG.md"

[project.scripts]
council = "agent_council.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string and `license-files`
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_council"]

[tool.setuptools.package-data]
agent_council = ["agents.yaml"]
